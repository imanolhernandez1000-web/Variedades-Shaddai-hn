<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Variedades Shaddai</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ff;--surface:#fff;--ink:#241a4d;--muted:#5d5683;--brand:#4b2fb8;--pop:#e8336d;--sun:#ffc93c;--line:#e2dcf7;--wa:#1faa59;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.soc a{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;font-weight:700;font-size:.95rem;text-decoration:none;color:#fff}
.soc .tt{background:#111}.soc .fb{background:#1877f2}.soc .ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#fbf9ff,#f1ecff 55%,#fff3f7)}
.bgfx span{position:absolute;filter:blur(5px);opacity:.3;line-height:1;user-select:none}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:21}
.bar{display:flex;align-items:center;gap:18px;padding:10px 20px;max-width:1080px;margin:0 auto}
.logo{font:800 1.25rem "Bricolage Grotesque",sans-serif;text-decoration:none;white-space:nowrap;color:var(--brand)}
.logo span{color:var(--pop)}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 14px;border-radius:99px;text-decoration:none;font-weight:700;font-size:.95rem;white-space:nowrap;color:var(--muted)}
nav a:hover{background:var(--bg)}
nav a[aria-current=page]{background:var(--brand);color:#fff}
.hero{padding:56px 0 36px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;max-width:14ch}
.hero h1 em{font-style:normal;background:var(--sun);color:#241a4d;padding:0 .15em;border-radius:.2em}
.hero p{max-width:46ch;color:var(--muted);font-size:1.15rem;margin:18px 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:99px;background:var(--wa);color:#fff;font-weight:700;text-decoration:none;border:0;font-size:1rem;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.small{padding:9px 16px;font-size:.92rem}
.btn.alt{background:transparent;color:var(--brand);border:2px solid var(--brand)}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding-bottom:40px}
.tile{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:22px;text-decoration:none;color:#fff;min-height:170px;transition:transform .15s}
.tile:hover{transform:translateY(-4px)}
.tile .ic{font-size:2.4rem}
.tile h3{font-size:1.4rem}
.tile p{margin:0;font-size:.93rem;opacity:.92}
.t1{background:#4b2fb8}.t2{background:#e8336d}.t3{background:#1769c9}.t4{background:#c97a12}.t5{background:#a8348f}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:10px 0 50px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.how b{display:block;font:700 1.1rem "Bricolage Grotesque",sans-serif;margin-bottom:4px}
.how span{color:var(--muted);font-size:.96rem}
.cat-head{padding:40px 0 24px}
.cat-head .ic{font-size:3rem}
.cat-head h2{font-size:clamp(2rem,6vw,3.2rem);margin:6px 0 8px}
.cat-head p{color:var(--muted);max-width:52ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding-bottom:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;background:var(--bg)}
.card h3{font-size:1.25rem}
.card p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.back{display:inline-block;margin:0 0 40px;font-weight:700;color:var(--brand)}
.contact{background:var(--brand);color:#fff;border-radius:26px;padding:34px 26px;margin:10px 0 50px;text-align:center}
.contact h2{font-size:clamp(1.6rem,4vw,2.3rem);margin-bottom:8px}
.contact p{margin:0 0 20px;opacity:.9}
footer{padding:26px 20px 90px;text-align:center;color:var(--muted);font-size:.9rem}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.view{display:none}.view.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:560px){.bar{gap:10px;padding:8px 14px}.fab span{display:none}.fab{padding:15px}}
</style>
</head>
<body>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<header><div class="bar">
<a class="logo" href="#inicio">Variedades <span>Shaddai</span></a>
<nav id="nav" aria-label="Categorías"></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer><a href="https://wa.me/50497479719?text=Hola%2C%20quiero%20consultar%20sobre%20sus%20productos" target="_blank" rel="noopener" style="font-weight:700;color:var(--wa)">💬 Escríbenos al WhatsApp +504 9747-9719</a><div class="soc" style="margin:14px 0"><a class="fb" target="_blank" rel="noopener" href="https://www.facebook.com/share/1C434savzm/">📘 Facebook</a><a class="ig" target="_blank" rel="noopener" href="https://www.instagram.com/variedadesshaddai2026">📸 Instagram</a><a class="tt" target="_blank" rel="noopener" href="https://www.tiktok.com/@variedades.shadda924">🎵 TikTok</a></div>© Variedades Shaddai · Precios y disponibilidad por WhatsApp</footer>
<a class="btn fab" id="fab" target="_blank" rel="noopener">💬 <span>Escríbenos</span></a>

<script>
// ⚠️ Cambia este número por el WhatsApp del negocio (código de país 504 + número, sin espacios ni +)
var WA="50497479719";
(function(){var e=["🎮","👜","👕","📱","📿","🛒"],p=[[4,6,70],[24,3,54],[48,8,80],[72,4,60],[90,12,72],[10,30,56],[36,36,84],[62,32,58],[84,40,76],[3,58,78],[26,64,58],[50,60,70],[74,66,86],[92,76,56],[12,86,72],[40,88,60],[66,90,78]],b=document.getElementById("bgfx");p.forEach(function(q,i){var s=document.createElement("span");s.textContent=e[i%e.length];s.style.cssText="left:"+q[0]+"%;top:"+q[1]+"%;font-size:"+q[2]+"px;transform:rotate("+((i*37)%50-25)+"deg)";b.appendChild(s)})})();
var C=[
{id:"sublimacion",n:"Sublimación",ic:"🎨",cls:"t2",d:"Personaliza lo que quieras con tu diseño, foto o frase.",items:[
["Camisas","👕","Estampados a todo color para ti, tu familia o tu equipo."],
["Tazas","☕","El regalo perfecto con foto, nombre o mensaje."],
["Termos","🧴","Termos personalizados que duran y se ven increíbles."],
["Otros productos","✨","Gorras, mousepads, llaveros y más. Cuéntanos tu idea."]]},
{id:"tecnologia",n:"Tecnología",ic:"📱",cls:"t3",d:"Lo último en equipos y accesorios para estar siempre conectado.",items:[
["Celulares","📱","Modelos para todo presupuesto, nuevos y con garantía."],
["Tablets","💻","Para estudiar, trabajar o entretenerte."],
["Cargadores","🔌","Cargadores y cables de calidad para tu equipo."],
["Baterías portátiles","🔋","Power banks para que nunca te quedes sin carga."]]},
{id:"hogar",n:"Hogar",ic:"🏠",cls:"t4",d:"Cosas útiles y bonitas para disfrutar tu casa.",items:[
["Parlantes grandes","🔊","Sonido potente para fiestas y reuniones."],
["Fundas de cama","🛏️","Fundas cómodas y bonitas para renovar tu cuarto."],
["Juguetes","🧸","Diversión para los más pequeños de la casa."]]},
{id:"cuidado-personal",n:"Cuidado personal",ic:"💄",cls:"t5",d:"Cuídate y siéntete bien todos los días.",items:[
["Cremas","🧴","Hidratación y cuidado para tu piel."],
["Maquillaje","💋","Todo para tu look, de lo natural a lo atrevido."],
["Perfumes","🌸","Fragancias que dejan huella."],
["Skin care","🧖‍♀️","Rutinas de cuidado facial para una piel sana."]]},
{id:"accesorios",n:"Accesorios",ic:"👜",cls:"t1",d:"Detalles que completan tu estilo.",items:[
["Accesorios de todo tipo","✨","Tenemos mucha variedad. Escríbenos y te mostramos lo que hay."]]}
];
function wa(t){return "https://wa.me/"+WA+"?text="+encodeURIComponent(t)}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var nav=document.getElementById("nav"),app=document.getElementById("app"),fab=document.getElementById("fab");
nav.innerHTML='<a href="#inicio" data-id="inicio">Inicio</a>'+C.map(function(c){return '<a href="#'+c.id+'" data-id="'+c.id+'">'+c.ic+' '+c.n+'</a>'}).join("");
function home(){
return '<section class="hero"><h1>Todo lo que buscas, en <em>un solo lugar</em></h1>'+
'<p>Sublimación personalizada, tecnología, hogar y cuidado personal. Elige una categoría y pregúntanos por WhatsApp.</p>'+
'<a class="btn" target="_blank" rel="noopener" href="'+wa("Hola, quiero consultar sobre sus productos en Variedades Shaddai")+'">💬 Escribir por WhatsApp</a></section>'+
'<div class="tiles">'+C.map(function(c){return '<a class="tile '+c.cls+'" href="#'+c.id+'"><span class="ic">'+c.ic+'</span><h3>'+c.n+'</h3><p>'+c.d+'</p></a>'}).join("")+'</div>'+
'<div class="how"><div><b>1. Elige una categoría</b><span>Cada una tiene su propio menú con sus productos.</span></div><div><b>2. Toca “Consultar”</b><span>Se abre WhatsApp con el mensaje ya escrito.</span></div><div><b>3. Te respondemos</b><span>Precios, disponibilidad y envíos, sin compromiso.</span></div></div>'+
contact();}
function contact(){return '<section class="contact"><h2>¿No encuentras lo que buscas?</h2><p>Escríbenos y te ayudamos a encontrarlo.</p><a class="btn" style="background:#fff;color:#1b7a40" target="_blank" rel="noopener" href="'+wa("Hola, quiero consultar sobre un producto")+'">💬 Chatear ahora</a><div class="soc">'+social()+'</div></section>'}
function social(){return '<a class="fb" target="_blank" rel="noopener" href="https://www.facebook.com/share/1C434savzm/">📘 Facebook</a><a class="ig" target="_blank" rel="noopener" href="https://www.instagram.com/variedadesshaddai2026">📸 Instagram</a><a class="tt" target="_blank" rel="noopener" href="https://www.tiktok.com/@variedades.shadda924">🎵 TikTok</a>'}
function cat(c){
return '<section class="cat-head"><div class="ic">'+c.ic+'</div><h2>'+c.n+'</h2><p>'+c.d+'</p></section>'+
'<div class="grid">'+c.items.map(function(i){return '<article class="card"><div class="ic">'+i[1]+'</div><h3>'+esc(i[0])+'</h3><p>'+esc(i[2])+'</p><a class="btn small" target="_blank" rel="noopener" href="'+wa("Hola, quiero consultar sobre "+i[0]+" ("+c.n+")")+'">💬 Consultar</a></article>'}).join("")+'</div>'+
'<a class="back" href="#inicio">← Volver al inicio</a>'+contact();}
function route(){
var id=(location.hash||"#inicio").slice(1),c=C.filter(function(x){return x.id===id})[0];
app.innerHTML=c?cat(c):home();
[].forEach.call(nav.children,function(a){var on=a.dataset.id===(c?id:"inicio");if(on){a.setAttribute("aria-current","page");a.scrollIntoView({inline:"center",block:"nearest"})}else a.removeAttribute("aria-current")});
fab.href=wa(c?"Hola, quiero consultar sobre "+c.n:"Hola, quiero consultar sobre sus productos");
window.scrollTo(0,0);document.title=(c?c.n+" · ":"")+"Variedades Shaddai";}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
